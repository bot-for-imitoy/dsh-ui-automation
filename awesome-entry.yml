url: https://github.com/bot-for-imitoy/dsh-ui-automation
name: bot-for-imitoy/dsh-ui-automation
category: tools
description:
  en: "Linux-only headless Xvfb sandbox that drives GUI applications through AT-SPI with an XTEST fallback, and verifies every click, drag, scroll and key press by reading the application state back."
  zh: "仅限 Linux 的隔离无头 Xvfb 沙盒：通过 AT-SPI（XTEST 兜底）驱动 GUI 应用，并在每次点击、拖拽、滚动和输入后回读应用状态，确认动作真正生效。"
