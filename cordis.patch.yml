- insert:
    - id: ui-automation
      name: 'dsh-ui-automation'
      config:
        display: ''
        dbusAddress: ''
        atspiBusAddress: ''
        screenshotDir: ''
        fontFile: '/usr/share/fonts/TTF/Hack-Bold.ttf'
        maxDepth: 24
        maxTargets: 60
        padding: 0
        crop: true
        afterSeconds: 1
        keepImages: 15
        gtk4OriginFallback: true
        attachImage: true
        enabledSessionIds: ''
        allowedWorkspacePaths: ''
        allowAllSessions: false
